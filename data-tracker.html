<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', sans-serif;
            background: white;
            overflow-x: hidden;
        }

        .tab-container {
            width: 100%;
            max-width: 100%;
        }

        .frequency-selector {
            padding: 15px 20px;
            background: #f8f8f8;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .selector-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .frequency-selector label {
            font-weight: 500;
            color: #262262;
            font-size: 14px;
        }

        .frequency-selector select {
            padding: 8px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 4px;
            font-family: 'Lato', sans-serif;
            font-size: 14px;
            background: white;
            cursor: pointer;
            color: #262262;
            font-weight: 500;
            transition: border-color 0.3s ease;
        }

        .frequency-selector select:hover {
            border-color: #262262;
        }

        .frequency-selector select:focus {
            outline: none;
            border-color: #262262;
        }

        .chart-type-toggle {
            display: flex;
            border: 2px solid #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            background: white;
        }

        .chart-type-button {
            padding: 8px 15px;
            border: none;
            background: white;
            cursor: pointer;
            font-family: 'Lato', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: #666;
            transition: all 0.3s ease;
            border-right: 1px solid #e0e0e0;
        }

        .chart-type-button:last-child {
            border-right: none;
        }

        .chart-type-button:hover {
            background: #f5f5f5;
            color: #262262;
        }

        .chart-type-button.active {
            background: #262262;
            color: white;
        }

        .export-button {
            margin-left: auto;
            padding: 8px 20px;
            background: #262262;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Lato', sans-serif;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .export-button:hover {
            background: #1a1a4a;
        }

        .custom-chart-builder {
            display: flex;
            gap: 20px;
            padding: 20px;
            height: calc(100% - 40px);
        }

        .series-selector {
            width: 300px;
            background: #f8f8f8;
            padding: 20px;
            border-radius: 8px;
            overflow-y: auto;
            max-height: 600px;
        }

        .series-selector h3 {
            margin: 0 0 15px 0;
            color: #262262;
            font-size: 16px;
            font-weight: 600;
        }

        .series-group {
            margin-bottom: 20px;
        }

        .series-group-title {
            font-weight: 600;
            color: #262262;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .series-checkbox {
            display: flex;
            align-items: center;
            margin: 8px 0;
            cursor: pointer;
        }

        .series-checkbox input[type="checkbox"] {
            margin-right: 8px;
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        .series-checkbox label {
            cursor: pointer;
            font-size: 14px;
            color: #333;
        }

        .series-checkbox input[type="checkbox"]:disabled + label {
            color: #999;
            cursor: not-allowed;
        }

        .selection-counter {
            margin-top: 15px;
            padding: 10px;
            background: white;
            border-radius: 4px;
            text-align: center;
            font-size: 13px;
            color: #666;
        }

        .selection-counter.max {
            background: #fff3cd;
            color: #856404;
            font-weight: 500;
        }

        .date-range-container {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 4px;
        }

        .date-range-container h4 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #262262;
        }

        .dual-range-slider {
            position: relative;
            width: 100%;
            height: 40px;
            margin: 20px 0 10px 0;
        }

        .dual-range-slider input[type="range"] {
            position: absolute;
            width: 100%;
            height: 5px;
            background: transparent;
            pointer-events: none;
            -webkit-appearance: none;
        }

        .dual-range-slider input[type="range"]::-webkit-slider-thumb {
            pointer-events: all;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #262262;
            background: white;
            cursor: pointer;
            -webkit-appearance: none;
        }

        .dual-range-slider input[type="range"]::-moz-range-thumb {
            pointer-events: all;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #262262;
            background: white;
            cursor: pointer;
        }

        .slider-track {
            position: absolute;
            width: 100%;
            height: 5px;
            background: #e0e0e0;
            border-radius: 3px;
            top: 50%;
            transform: translateY(-50%);
        }

        .slider-range {
            position: absolute;
            height: 5px;
            background: #262262;
            border-radius: 3px;
            top: 50%;
            transform: translateY(-50%);
        }

        .date-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .custom-chart-display {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .custom-chart-placeholder {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 16px;
            text-align: center;
            padding: 40px;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            background: white;
            margin: 0;
            padding: 0;
        }

        .tab-button {
            flex: 1;
            padding: 15px 20px;
            background: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-family: 'Lato', sans-serif;
            font-weight: 500;
            color: #666;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .tab-button:hover {
            background: #f5f5f5;
            color: #262262;
        }

        .tab-button.active {
            color: #262262;
            border-bottom: 3px solid #262262;
            background: white;
        }

        .tab-content {
            width: 100%;
            background: white;
            position: absolute;
            top: 60px;
            left: 0;
            right: 0;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.1s ease;
        }

        .tab-content.active {
            position: relative;
            top: 0;
            opacity: 1;
            visibility: visible;
        }

        .chart-container {
            width: 100%;
            height: 600px;
        }
    </style>
</head>
<body>
    <div class="tab-container">
        <div class="frequency-selector">
            <div class="selector-group">
                <label for="frequency-select">Frequency:</label>
                <select id="frequency-select" onchange="changeFrequency(this.value)">
                    <option value="monthly" selected>Monthly</option>
                    <option value="quarterly">Quarterly</option>
                    <option value="annual">Annual</option>
                </select>
            </div>

            <div class="selector-group">
                <label>Chart Type:</label>
                <div class="chart-type-toggle">
                    <button class="chart-type-button active" onclick="changeChartType('line')">Line</button>
                    <button class="chart-type-button" onclick="changeChartType('bar')">Bar</button>
                </div>
            </div>

            <button class="export-button" onclick="exportToExcel()">Export to Excel</button>
        </div>

        <div class="tabs">
            <button class="tab-button active" onclick="openTab(event, 'retail-sales')">Retail Sales</button>
            <button class="tab-button" onclick="openTab(event, 'shop-prices')">Shop Prices</button>
            <button class="tab-button" onclick="openTab(event, 'footfall')">Footfall</button>
            <button class="tab-button" onclick="openTab(event, 'custom-chart')">Build Your Own</button>
        </div>

        <div id="retail-sales" class="tab-content active">
            <div id="retail-sales-chart" class="chart-container"></div>
        </div>

        <div id="shop-prices" class="tab-content">
            <div id="spi-chart" class="chart-container"></div>
        </div>

        <div id="footfall" class="tab-content">
            <div id="footfall-chart" class="chart-container"></div>
        </div>

        <div id="custom-chart" class="tab-content">
            <div class="custom-chart-builder">
                <div class="series-selector">
                    <h3>Select Series (Max 8)</h3>

                    <div class="series-group">
                        <div class="series-group-title">Retail Sales Monitor</div>
                        <div class="series-checkbox">
                            <input type="checkbox" id="rsm-total" value="rsm-total" onchange="updateCustomChart()">
                            <label for="rsm-total">Total Sales</label>
                        </div>
                        <div class="series-checkbox">
                            <input type="checkbox" id="rsm-food" value="rsm-food" onchange="updateCustomChart()">
                            <label for="rsm-food">Food Sales</label>
                        </div>
                        <div class="series-checkbox">
                            <input type="checkbox" id="rsm-nonfood" value="rsm-nonfood" onchange="updateCustomChart()">
                            <label for="rsm-nonfood">Non-Food Sales</label>
                        </div>
                    </div>

                    <div class="series-group">
                        <div class="series-group-title">Shop Price Index</div>
                        <div class="series-checkbox">
                            <input type="checkbox" id="spi-all" value="spi-all" onchange="updateCustomChart()">
                            <label for="spi-all">All Items</label>
                        </div>
                        <div class="series-checkbox">
                            <input type="checkbox" id="spi-food" value="spi-food" onchange="updateCustomChart()">
                            <label for="spi-food">Food Prices</label>
                        </div>
                        <div class="series-checkbox">
                            <input type="checkbox" id="spi-nonfood" value="spi-nonfood" onchange="updateCustomChart()">
                            <label for="spi-nonfood">Non-Food Prices</label>
                        </div>
                    </div>

                    <div class="series-group">
                        <div class="series-group-title">Footfall</div>
                        <div class="series-checkbox">
                            <input type="checkbox" id="ff-total" value="ff-total" onchange="updateCustomChart()">
                            <label for="ff-total">Total Retail</label>
                        </div>
                        <div class="series-checkbox">
                            <input type="checkbox" id="ff-highstreets" value="ff-highstreets" onchange="updateCustomChart()">
                            <label for="ff-highstreets">High Streets</label>
                        </div>
                        <div class="series-checkbox">
                            <input type="checkbox" id="ff-retailparks" value="ff-retailparks" onchange="updateCustomChart()">
                            <label for="ff-retailparks">Retail Parks</label>
                        </div>
                        <div class="series-checkbox">
                            <input type="checkbox" id="ff-shopping" value="ff-shopping" onchange="updateCustomChart()">
                            <label for="ff-shopping">Shopping Centres</label>
                        </div>
                    </div>

                    <div class="selection-counter" id="selection-counter">
                        0 / 8 series selected
                    </div>

                    <div class="date-range-container" id="date-range-container" style="display: none;">
                        <h4>Date Range</h4>
                        <div class="dual-range-slider">
                            <div class="slider-track"></div>
                            <div class="slider-range" id="slider-range"></div>
                            <input type="range" id="range-min" min="0" max="100" value="0" oninput="updateDateRange()">
                            <input type="range" id="range-max" min="0" max="100" value="100" oninput="updateDateRange()">
                        </div>
                        <div class="date-labels">
                            <span id="date-start-label"></span>
                            <span id="date-end-label"></span>
                        </div>
                    </div>
                </div>

                <div class="custom-chart-display">
                    <div id="custom-chart-area" class="chart-container" style="display: none;"></div>
                    <div id="custom-chart-placeholder" class="custom-chart-placeholder">
                        Select series from the left to build your custom chart
                    </div>
                </div>
            </div>
        </div>
    </div>

            var earliestDate = null;
            var latestDate = null;

            // Build traces for each selected series
            selectedSeries.forEach(function(seriesId, index) {
                var mapping = seriesMapping[seriesId];
                var dataset = chartData[mapping.dataset][currentFrequency];

                // Find the trace in the dataset
                var sourceTrace = dataset.data.find(function(t) {
                    return t.name === mapping.column;
                });

                if (sourceTrace) {
                    var trace = {
                        x: sourceTrace.x,
                        y: sourceTrace.y,
                        name: mapping.label,
                        type: currentChartType === 'bar' ? 'bar' : 'scatter',
                        mode: 'lines',
                        line: { color: customColors[index % customColors.length], width: 2 }
                    };

                    if (currentChartType === 'bar') {
                        trace.marker = { color: customColors[index % customColors.length] };
                    }

                    traces.push(trace);

                    // Track date range
                    if (!earliestDate || sourceTrace.x[0] < earliestDate) {
                        earliestDate = sourceTrace.x[0];
                    }
                    if (!latestDate || sourceTrace.x[sourceTrace.x.length - 1] > latestDate) {
                        latestDate = sourceTrace.x[sourceTrace.x.length - 1];
                    }
                }
            });

            // Store for date range filtering
            customChartData = traces;
            allDates = traces[0] ? traces[0].x : [];

            // Reset sliders to full range
            document.getElementById('range-min').value = 0;
            document.getElementById('range-max').value = 100;
            updateSliderVisual();

            // Update date labels
            if (allDates.length > 0) {
                document.getElementById('date-start-label').textContent = allDates[0];
                document.getElementById('date-end-label').textContent = allDates[allDates.length - 1];
            }

            var layout = {
                font: { family: "Lato", size: 16 },
                xaxis: { showgrid: false, gridcolor: 'rgba(0,0,0,0.1)' },
                yaxis: { 
                    title: 'Year Percentage Change (%)',
                    showgrid: true, 
                    gridcolor: 'rgba(0,0,0,0.1)', 
                    side: 'right' 
                },
                plot_bgcolor: 'rgba(255, 255, 255, 0)',
                legend: { orientation: 'h', y: 1.15, x: 0.0 },
                margin: { b: 60, t: 40 }
            };

            Plotly.newPlot('custom-chart-area', traces, layout, { responsive: true, displayModeBar: true });
        }

        function updateSliderVisual() {
            var minSlider = document.getElementById('range-min');
            var maxSlider = document.getElementById('range-max');
            var sliderRange = document.getElementById('slider-range');

            if (!minSlider || !maxSlider || !sliderRange) return;

            var minVal = parseInt(minSlider.value);
            var maxVal = parseInt(maxSlider.value);

            // Prevent sliders from crossing - ensure min is always less than max
            if (minVal > maxVal - 1) {
                minSlider.value = maxVal - 1;
                minVal = maxVal - 1;
            }
            if (maxVal < minVal + 1) {
                maxSlider.value = minVal + 1;
                maxVal = minVal + 1;
            }

            // Update visual range indicator
            sliderRange.style.left = minVal + '%';
            sliderRange.style.width = (maxVal - minVal) + '%';
        }

        function updateDateRange() {
            if (allDates.length === 0 || customChartData.length === 0) return;

            updateSliderVisual();

            var minSlider = document.getElementById('range-min');
            var maxSlider = document.getElementById('range-max');

            if (!minSlider || !maxSlider) return;

            var startIndex = Math.floor((parseInt(minSlider.value) / 100) * (allDates.length - 1));
            var endIndex = Math.ceil((parseInt(maxSlider.value) / 100) * (allDates.length - 1));

            // Ensure we have at least one data point
            if (endIndex <= startIndex) {
                endIndex = startIndex + 1;
            }
            if (endIndex >= allDates.length) {
                endIndex = allDates.length - 1;
            }

            // Filter traces based on date range
            var filteredTraces = customChartData.map(function(trace) {
                return {
                    x: trace.x.slice(startIndex, endIndex + 1),
                    y: trace.y.slice(startIndex, endIndex + 1),
                    name: trace.name,
                    type: trace.type,
                    mode: trace.mode,
                    line: trace.line,
                    marker: trace.marker
                };
            });

            var layout = {
                font: { family: "Lato", size: 16 },
                xaxis: { showgrid: false, gridcolor: 'rgba(0,0,0,0.1)' },
                yaxis: { 
                    title: 'Year Percentage Change (%)',
                    showgrid: true, 
                    gridcolor: 'rgba(0,0,0,0.1)', 
                    side: 'right' 
                },
                plot_bgcolor: 'rgba(255, 255, 255, 0)',
                legend: { orientation: 'h', y: 1.15, x: 0.0 },
                margin: { b: 60, t: 40 }
            };

            Plotly.react('custom-chart-area', filteredTraces, layout, { responsive: true, displayModeBar: true });

            // Update labels
            if (allDates[startIndex]) {
                document.getElementById('date-start-label').textContent = allDates[startIndex];
            }
            if (allDates[endIndex]) {
                document.getElementById('date-end-label').textContent = allDates[endIndex];
            }
        }

        // Excel export function
        function exportToExcel() {
            var data, filename;

            if (currentTab === 'retail-sales') {
                data = chartData.rsm[currentFrequency].data;
                filename = 'Retail_Sales_' + currentFrequency + '.xlsx';
            } else if (currentTab === 'shop-prices') {
                data = chartData.spi[currentFrequency].data;
                filename = 'Shop_Prices_' + currentFrequency + '.xlsx';
            } else if (currentTab === 'footfall') {
                data = chartData.ff[currentFrequency].data;
                filename = 'Footfall_' + currentFrequency + '.xlsx';
            } else if (currentTab === 'custom-chart') {
                // Export custom chart data
                if (customChartData.length === 0) {
                    alert('Please select series to export');
                    return;
                }
                data = customChartData;
                filename = 'Custom_Chart_' + currentFrequency + '.xlsx';
            } else {
                return;
            }

            // Build worksheet data
            var wsData = [];
            var headers = ['Date'];

            data.forEach(function(trace) {
                headers.push(trace.name);
            });
            wsData.push(headers);

            // Assuming all traces have same x-axis (dates)
            var dates = data[0].x;
            for (var i = 0; i < dates.length; i++) {
                var row = [dates[i]];
                data.forEach(function(trace) {
                    row.push(trace.y[i]);
                });
                wsData.push(row);
            }

            // Create workbook
            var wb = XLSX.utils.book_new();
            var ws = XLSX.utils.aoa_to_sheet(wsData);
            XLSX.utils.book_append_sheet(wb, ws, "Data");

            // Download
            XLSX.writeFile(wb, filename);
        }

        window.addEventListener('load', function() {
            createChart('retail-sales-chart', 'rsm', 'monthly', 'line');
        });
    </script>
</body>
</html>
