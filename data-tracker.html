<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', sans-serif;
            background: white;
            overflow-x: hidden;
        }

        .tab-container {
            width: 100%;
            max-width: 100%;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            background: white;
            margin: 0;
            padding: 0;
        }

        .tab-button {
            flex: 1;
            padding: 15px 20px;
            background: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-family: 'Lato', sans-serif;
            font-weight: 500;
            color: #666;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .tab-button:hover {
            background: #f5f5f5;
            color: #262262;
        }

        .tab-button.active {
            color: #262262;
            border-bottom: 3px solid #262262;
            background: white;
        }

        .tab-content {
            width: 100%;
            background: white;
            position: absolute;
            top: 60px;
            left: 0;
            right: 0;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.1s ease;
        }

        .tab-content.active {
            position: relative;
            top: 0;
            opacity: 1;
            visibility: visible;
        }

        .chart-container {
            width: 100%;
            height: 600px;
        }
    </style>
</head>
<body>
    <div class="tab-container">
        <div class="tabs">
            <button class="tab-button active" onclick="openTab(event, 'retail-sales', 'retail-sales-chart')">Retail Sales</button>
            <button class="tab-button" onclick="openTab(event, 'shop-prices', 'spi-chart')">Shop Prices</button>
            <button class="tab-button" onclick="openTab(event, 'footfall', 'footfall-chart')">Footfall</button>
        </div>

        <div id="retail-sales" class="tab-content active">
            <div id="retail-sales-chart" class="chart-container"></div>
        </div>

        <div id="shop-prices" class="tab-content">
            <div id="spi-chart" class="chart-container"></div>
        </div>

        <div id="footfall" class="tab-content">
            <div id="footfall-chart" class="chart-container"></div>
        </div>
    </div>

        var chartsCreated = {
            'retail-sales-chart': false,
            'spi-chart': false,
            'footfall-chart': false
        };

        function createChart(chartId, data, layout) {
            if (!chartsCreated[chartId]) {
                Plotly.newPlot(chartId, data, layout, {responsive: true, displayModeBar: true});
                chartsCreated[chartId] = true;
            }
        }

        function openTab(evt, tabName, chartId) {
            var i, tabcontent, tabbuttons;

            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].classList.remove("active");
            }

            tabbuttons = document.getElementsByClassName("tab-button");
            for (i = 0; i < tabbuttons.length; i++) {
                tabbuttons[i].classList.remove("active");
            }

            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");

            if (chartId === 'spi-chart') {
                createChart('spi-chart', spiData, spiLayout);
            } else if (chartId === 'footfall-chart') {
                createChart('footfall-chart', ffData, ffLayout);
            }

            setTimeout(function() {
                Plotly.Plots.resize(chartId);
            }, 50);
        }

        window.addEventListener('load', function() {
            createChart('retail-sales-chart', retailSalesData, retailSalesLayout);
        });
